<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    

    <div class="container">
        <div class="input">
            <input type="text" value="0" id="DisplayBox">
        </div>

        <div class="buttons">

            
            <button class="button" onclick="apendChild(`AC`)">AC</button>
            <button class="button" onclick="apendChild(`DEL`)">DEL</button>
            <button class="button" onclick="apendChild(`C`)">C</button>
            <button class="button operator" onclick="apendChild(`%`)">%</button>
            <button class="button" onclick="apendChild(`7`)">7</button>
            <button class="button" onclick="apendChild(`8`)">8</button>
            <button class="button" onclick="apendChild(`9`)">9</button>
            <button class="button operator" onclick="apendChild(`*`)">*</button>
            <button class="button" onclick="apendChild(`4`)">4</button>
            <button class="button" onclick="apendChild(`5`)">5</button>
            <button class="button" onclick="apendChild(`6`)">6</button>
            <button class="button operator" onclick="apendChild(`-`)">-</button>
            <button class="button" onclick="apendChild(`1`)">1</button>
            <button class="button" onclick="apendChild(`2`)">2</button>
            <button class="button" onclick="apendChild(`3`)">3</button>
            <button class="button operator" onclick="apendChild(`+`)">+</button>
            <button class="button" onclick="apendChild(`0`)">0</button>
             <button class="button" onclick="apendChild(`00`)">00</button>
            <button class="button" onclick="apendChild(`.`)">.</button>
            <button class="button operator" onclick="apendChild(`=`)">=</button>

        </div>
    </div>






    <script src="./app.js"></script>
</body>
</html>
